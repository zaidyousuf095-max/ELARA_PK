<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ELARA — Premium Women's Denim</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#fff;
    color:#111;
    overflow-x:hidden;
}

body.no-scroll{
    overflow:hidden;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

a{
    color:inherit;
}

/* =========================
   TOP BAR
========================= */

.topbar{
    height:36px;
    background:#111;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    letter-spacing:2px;
    text-align:center;
    padding:0 10px;
}

/* =========================
   HEADER
========================= */

header{
    height:82px;
    border-bottom:1px solid #e7e7e7;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    padding:0 28px;
    background:#fff;
    position:sticky;
    top:0;
    z-index:500;
}

.menu-btn,
.icon-btn{
    border:0;
    background:none;
    color:#111;
}

.menu-btn{
    width:42px;
    height:42px;
    font-size:28px;
    display:flex;
    align-items:center;
    justify-content:flex-start;
}

.logo{
    display:flex;
    justify-content:center;
    align-items:center;
}

.logo img{
    width:145px;
    max-height:60px;
    object-fit:contain;
}

.header-right{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:20px;
}

.icon-btn{
    width:42px;
    height:42px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    position:relative;
}

.cart-count{
    position:absolute;
    top:0;
    right:-2px;
    min-width:19px;
    height:19px;
    padding:0 5px;
    border-radius:20px;
    background:#111;
    color:#fff;
    font-size:10px;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* =========================
   DRAWERS / OVERLAYS
========================= */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    opacity:0;
    visibility:hidden;
    transition:.3s;
    z-index:800;
}

.overlay.active{
    opacity:1;
    visibility:visible;
}

.drawer{
    position:fixed;
    top:0;
    bottom:0;
    width:min(420px,88vw);
    background:#fff;
    z-index:900;
    transition:.35s ease;
    overflow-y:auto;
}

.menu-drawer{
    left:0;
    transform:translateX(-100%);
}

.cart-drawer{
    right:0;
    transform:translateX(100%);
}

.drawer.active{
    transform:translateX(0);
}

.drawer-header{
    height:80px;
    padding:0 25px;
    border-bottom:1px solid #eee;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.drawer-header h2{
    font-family:Georgia,serif;
    font-size:27px;
    font-weight:400;
}

.close-btn{
    width:40px;
    height:40px;
    border:0;
    background:none;
    font-size:27px;
}

.menu-links{
    padding:20px 25px;
}

.menu-links button{
    width:100%;
    background:none;
    border:0;
    border-bottom:1px solid #eee;
    padding:20px 0;
    text-align:left;
    font-size:13px;
    letter-spacing:2px;
}

.menu-links button:hover{
    padding-left:8px;
}

/* =========================
   SEARCH
========================= */

.search-overlay{
    position:fixed;
    inset:0;
    background:#fff;
    z-index:1000;
    opacity:0;
    visibility:hidden;
    transform:translateY(-15px);
    transition:.3s;
    overflow-y:auto;
}

.search-overlay.active{
    opacity:1;
    visibility:visible;
    transform:translateY(0);
}

.search-top{
    height:82px;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    gap:15px;
    padding:0 25px;
}

.search-top input{
    flex:1;
    border:0;
    outline:0;
    font-size:25px;
}

.search-close{
    border:0;
    background:none;
    font-size:28px;
}

.search-results{
    padding:35px 5%;
}

.search-results-title{
    font-family:Georgia,serif;
    font-size:32px;
    font-weight:400;
    margin-bottom:30px;
}

.search-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

/* =========================
   HERO
========================= */

.hero{
    position:relative;
    width:100%;
    height:78vh;
    min-height:560px;
    overflow:hidden;
    background:#eee;
}

.hero img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.hero::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        to top,
        rgba(0,0,0,.55),
        rgba(0,0,0,.05) 60%,
        transparent
    );
}

.hero-text{
    position:absolute;
    left:7%;
    bottom:10%;
    color:#fff;
    z-index:2;
}

.hero-text small{
    font-size:10px;
    letter-spacing:4px;
}

.hero-text h1{
    font-family:Georgia,serif;
    font-size:60px;
    font-weight:400;
    line-height:1;
    margin:15px 0 25px;
}

.hero-btn{
    display:inline-block;
    background:#fff;
    color:#111;
    padding:16px 28px;
    text-decoration:none;
    font-size:10px;
    letter-spacing:2px;
    border:1px solid #fff;
}

.hero-btn:hover{
    background:#111;
    color:#fff;
}

/* =========================
   CATEGORY BAR
========================= */

.category-bar{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    border-bottom:1px solid #ddd;
}

.category-btn{
    border:0;
    border-right:1px solid #ddd;
    background:#fff;
    padding:24px 10px;
    font-size:10px;
    letter-spacing:1.5px;
}

.category-btn:last-child{
    border-right:0;
}

.category-btn:hover,
.category-btn.active{
    background:#111;
    color:#fff;
}

/* =========================
   COLLECTION
========================= */

.collection{
    padding:80px 5%;
}

.section-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom:40px;
}

.section-head h2{
    font-family:Georgia,serif;
    font-size:45px;
    font-weight:400;
}

.section-head span{
    font-size:10px;
    letter-spacing:2px;
    color:#555;
}

.products{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
}

.product{
    position:relative;
    background:#f5f5f5;
    overflow:hidden;
}

.product-image-wrap{
    position:relative;
    overflow:hidden;
    background:#eee;
}

.product-image{
    width:100%;
    height:520px;
    object-fit:cover;
    display:block;
    transition:.5s;
    cursor:pointer;
}

.product:hover .product-image{
    transform:scale(1.035);
}

.wishlist-btn{
    position:absolute;
    top:15px;
    right:15px;
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:#fff;
    font-size:19px;
    z-index:2;
}

.wishlist-btn.active{
    background:#111;
    color:#fff;
}

.quick-view{
    position:absolute;
    left:15px;
    right:15px;
    bottom:15px;
    padding:14px;
    border:0;
    background:#fff;
    color:#111;
    font-size:10px;
    letter-spacing:2px;
    opacity:0;
    transform:translateY(10px);
    transition:.3s;
}

.product:hover .quick-view{
    opacity:1;
    transform:translateY(0);
}

.product-info{
    background:#fff;
    padding:18px 8px 22px;
}

.product-name{
    font-size:15px;
    margin-bottom:8px;
    font-weight:500;
    cursor:pointer;
}

.product-type{
    color:#777;
    font-size:11px;
    line-height:1.7;
    margin-bottom:10px;
}

.price{
    font-size:13px;
    font-weight:bold;
    line-height:1.8;
}

.product-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:15px;
}

.add-btn,
.order-btn{
    display:block;
    border:0;
    padding:14px 8px;
    text-align:center;
    text-decoration:none;
    font-size:9px;
    letter-spacing:1.2px;
}

.add-btn{
    background:#111;
    color:#fff;
}

.order-btn{
    background:#eee;
    color:#111;
}

.add-btn:hover{
    background:#333;
}

.order-btn:hover{
    background:#ddd;
}

/* =========================
   INFO BOX
========================= */

.info-box{
    margin-top:50px;
    padding:35px 20px;
    background:#f5f3ee;
    text-align:center;
}

.info-box h3{
    font-family:Georgia,serif;
    font-size:29px;
    font-weight:400;
    margin-bottom:12px;
}

.info-box p{
    color:#666;
    font-size:13px;
    line-height:1.9;
}

/* =========================
   ABOUT
========================= */

.about{
    background:#f5f3ee;
    padding:110px 8%;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:80px;
    align-items:center;
}

.about h2{
    font-family:Georgia,serif;
    font-size:65px;
    font-weight:400;
    line-height:.98;
}

.about p{
    color:#666;
    line-height:1.9;
    font-size:14px;
}

.about-btn{
    display:inline-block;
    margin-top:25px;
    background:#111;
    color:#fff;
    padding:15px 25px;
    text-decoration:none;
    font-size:10px;
    letter-spacing:2px;
}

/* =========================
   FEATURES
========================= */

.features{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    border-bottom:1px solid #ddd;
}

.feature{
    padding:55px 20px;
    text-align:center;
    border-right:1px solid #ddd;
}

.feature:last-child{
    border:0;
}

.feature h3{
    font-family:Georgia,serif;
    font-size:21px;
    font-weight:400;
    margin-bottom:10px;
}

.feature p{
    color:#777;
    font-size:11px;
}

/* =========================
   FOOTER
========================= */

footer{
    background:#111;
    color:#fff;
    text-align:center;
    padding:75px 20px 30px;
}

.footer-logo{
    font-family:Georgia,serif;
    font-size:38px;
    letter-spacing:8px;
}

footer p{
    color:#999;
    font-size:12px;
    margin-top:15px;
}

.footer-links{
    margin-top:30px;
    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:wrap;
}

.footer-links button{
    background:none;
    border:0;
    color:#fff;
    font-size:10px;
    letter-spacing:1px;
}

.copy{
    margin-top:45px;
    border-top:1px solid #333;
    padding-top:25px;
    color:#777;
    font-size:10px;
}

/* =========================
   WHATSAPP
========================= */

.whatsapp{
    position:fixed;
    right:20px;
    bottom:20px;
    width:58px;
    height:58px;
    background:#111;
    color:#fff;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    font-size:10px;
    letter-spacing:1px;
    z-index:600;
    box-shadow:0 5px 25px rgba(0,0,0,.2);
}

/* =========================
   CART
========================= */

.cart-body{
    padding:20px;
}

.cart-item{
    display:grid;
    grid-template-columns:75px 1fr auto;
    gap:12px;
    padding:18px 0;
    border-bottom:1px solid #eee;
}

.cart-item img{
    width:75px;
    height:95px;
    object-fit:cover;
}

.cart-item-name{
    font-size:13px;
    margin-bottom:7px;
}

.cart-item-size{
    color:#777;
    font-size:10px;
    margin-bottom:8px;
}

.cart-item-price{
    font-size:12px;
    font-weight:bold;
}

.qty{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:10px;
}

.qty button{
    width:25px;
    height:25px;
    border:1px solid #ddd;
    background:#fff;
}

.remove-item{
    border:0;
    background:none;
    font-size:11px;
    color:#888;
}

.cart-bottom{
    border-top:1px solid #ddd;
    padding:20px;
    position:sticky;
    bottom:0;
    background:#fff;
}

.cart-total{
    display:flex;
    justify-content:space-between;
    font-size:15px;
    margin-bottom:15px;
}

.checkout-btn{
    width:100%;
    border:0;
    background:#111;
    color:#fff;
    padding:16px;
    letter-spacing:1.5px;
    font-size:10px;
}

.empty-cart{
    text-align:center;
    padding:70px 20px;
    color:#777;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    z-index:1100;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    opacity:0;
    visibility:hidden;
    transition:.3s;
}

.modal.active{
    opacity:1;
    visibility:visible;
}

.modal-box{
    background:#fff;
    width:min(1000px,100%);
    max-height:92vh;
    overflow-y:auto;
    position:relative;
    transform:translateY(20px);
    transition:.3s;
}

.modal.active .modal-box{
    transform:translateY(0);
}

.modal-close{
    position:absolute;
    top:15px;
    right:15px;
    width:40px;
    height:40px;
    border:0;
    background:#fff;
    border-radius:50%;
    font-size:24px;
    z-index:2;
}

.product-detail{
    display:grid;
    grid-template-columns:1fr 1fr;
}

.detail-image{
    width:100%;
    min-height:650px;
    object-fit:cover;
}

.detail-info{
    padding:55px 45px;
}

.detail-info h2{
    font-family:Georgia,serif;
    font-size:36px;
    font-weight:400;
    margin-bottom:15px;
}

.detail-description{
    color:#777;
    line-height:1.8;
    font-size:13px;
    margin:20px 0;
}

.detail-price{
    font-size:18px;
    font-weight:bold;
    margin-bottom:25px;
}

.size-title{
    font-size:10px;
    letter-spacing:1.5px;
    margin-bottom:10px;
}

.sizes{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:25px;
}

.size-btn{
    min-width:55px;
    padding:12px;
    background:#fff;
    border:1px solid #ccc;
    font-size:11px;
}

.size-btn.selected{
    background:#111;
    color:#fff;
    border-color:#111;
}

.detail-add{
    width:100%;
    padding:17px;
    background:#111;
    color:#fff;
    border:0;
    font-size:10px;
    letter-spacing:2px;
}

.detail-whatsapp{
    width:100%;
    padding:16px;
    background:#eee;
    border:0;
    margin-top:10px;
    font-size:10px;
    letter-spacing:1.5px;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translate(-50%,30px);
    background:#111;
    color:#fff;
    padding:14px 22px;
    font-size:11px;
    z-index:2000;
    opacity:0;
    visibility:hidden;
    transition:.3s;
}

.toast.show{
    opacity:1;
    visibility:visible;
    transform:translate(-50%,0);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

    .products{
        grid-template-columns:repeat(2,1fr);
    }

    .search-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .product-detail{
        grid-template-columns:1fr;
    }

    .detail-image{
        min-height:450px;
        max-height:550px;
    }

    .about{
        grid-template-columns:1fr;
        gap:40px;
    }

    .features{
        grid-template-columns:1fr;
    }

    .feature{
        border-right:0;
        border-bottom:1px solid #ddd;
    }
}

@media(max-width:600px){

    .topbar{
        height:32px;
        font-size:7px;
        letter-spacing:1.3px;
    }

    header{
        height:70px;
        padding:0 12px;
    }

    .logo img{
        width:105px;
        max-height:48px;
    }

    .header-right{
        gap:4px;
    }

    .icon-btn{
        width:38px;
        height:38px;
        font-size:21px;
    }

    .menu-btn{
        font-size:26px;
    }

    .hero{
        height:68vh;
        min-height:470px;
    }

    .hero-text{
        left:6%;
        bottom:8%;
    }

    .hero-text h1{
        font-size:42px;
    }

    .category-bar{
        grid-template-columns:repeat(5,1fr);
        overflow-x:auto;
    }

    .category-btn{
        min-width:125px;
    }

    .collection{
        padding:55px 12px;
    }

    .section-head{
        display:block;
    }

    .section-head h2{
        font-size:32px;
        margin-bottom:12px;
    }

    .products{
        grid-template-columns:1fr 1fr;
        gap:10px;
    }

    .product-image{
        height:290px;
    }

    .quick-view{
        display:none;
    }

    .product-info{
        padding:13px 6px 16px;
    }

    .product-name{
        font-size:12px;
    }

    .product-type{
        font-size:9px;
    }

    .price{
        font-size:10px;
    }

    .product-actions{
        grid-template-columns:1fr;
        gap:5px;
    }

    .add-btn,
    .order-btn{
        padding:11px 4px;
        font-size:7px;
    }

    .about{
        padding:70px 25px;
    }

    .about h2{
        font-size:45px;
    }

    .info-box{
        padding:30px 15px;
    }

    .search-top{
        padding:0 15px;
    }

    .search-top input{
        font-size:20px;
    }

    .search-results{
        padding:30px 12px;
    }

    .search-grid{
        grid-template-columns:1fr 1fr;
        gap:10px;
    }

    .detail-info{
        padding:35px 20px;
    }

    .detail-info h2{
        font-size:29px;
    }

    .detail-image{
        min-height:400px;
    }

    .whatsapp{
        width:54px;
        height:54px;
        right:15px;
        bottom:15px;
    }
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
    ELARA — PREMIUM WOMEN'S DENIM · WHOLESALE & RETAIL
</div>

<!-- HEADER -->
<header>

    <button class="menu-btn" onclick="openMenu()" aria-label="Open menu">
        ☰
    </button>

    <div class="logo">
        <img
        src="file_00000000043082119aa9a48a1ea4bdaf.png"
        alt="ELARA">
    </div>

    <div class="header-right">

        <button class="icon-btn" onclick="openSearch()" aria-label="Search">
            ⌕
        </button>

        <button class="icon-btn" onclick="openCart()" aria-label="Cart">
            🛒
            <span class="cart-count" id="cartCount">0</span>
        </button>

    </div>

</header>

<!-- MENU OVERLAY -->
<div class="overlay" id="menuOverlay" onclick="closeMenu()"></div>

<!-- MENU DRAWER -->
<div class="drawer menu-drawer" id="menuDrawer">

    <div class="drawer-header">
        <h2>ELARA</h2>
        <button class="close-btn" onclick="closeMenu()">×</button>
    </div>

    <div class="menu-links">

        <button onclick="goTo('home')">
            HOME
        </button>

        <button onclick="goTo('collection')">
            SHOP ALL
        </button>

        <button onclick="filterCategory('Wide Leg')">
            WIDE LEG
        </button>

        <button onclick="filterCategory('Embroidered')">
            EMBROIDERED
        </button>

        <button onclick="filterCategory('Relaxed Fit')">
            RELAXED FIT
        </button>

        <button onclick="goTo('about')">
            ABOUT ELARA
        </button>

        <button onclick="openSearch()">
            SEARCH
        </button>

        <button onclick="openCart()">
            SHOPPING BAG
        </button>

        <button onclick="openWhatsApp()">
            CONTACT / WHATSAPP
        </button>

    </div>

</div>

<!-- SEARCH -->
<div class="search-overlay" id="searchOverlay">

    <div class="search-top">

        <input
        id="searchInput"
        type="search"
        placeholder="Search denim..."
        oninput="searchProducts()"
        autocomplete="off">

        <button
        class="search-close"
        onclick="closeSearch()">
            ×
        </button>

    </div>

    <div class="search-results">

        <h2 class="search-results-title">
            Search Results
        </h2>

        <div
        class="search-grid"
        id="searchResults">
        </div>

    </div>

</div>

<!-- HERO -->
<section class="hero" id="home">

    <img
    src="file_000000000e2882118b0e73aa51d306a3.png"
    alt="ELARA Denim Collection">

    <div class="hero-text">

        <small>ELARA WOMEN'S DENIM</small>

        <h1>
